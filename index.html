<script>
const lvlLabel = document.getElementById('lvlLabel');
const taskEl = document.getElementById('task');
const areaEl = document.getElementById('area');
const feedbackEl = document.getElementById('feedback');
const winOverlay = document.getElementById('winOverlay');
const winTitle = document.getElementById('winTitle');
const winText = document.getElementById('winText');
const nextBtn = document.getElementById('nextBtn');
const eggToast = document.getElementById('eggToast');
const eggBar = document.getElementById('eggBar');
const adminBtn = document.getElementById('adminBtn');
const gameTitle = document.getElementById('gameTitle');
const gameAuthor = document.getElementById('gameAuthor');

let currentLevel = 1;
let totalLevels = 100;
let inSecret = false;
let secretStage = 0;
let secretSolved = false;
let adminUnlocked = localStorage.getItem('put_admin') === '1';
if (adminUnlocked) adminBtn.classList.add('unlocked');

const TOTAL_EGGS = 7;
let foundEggs = JSON.parse(localStorage.getItem('put_eggs') || '[]');
function updateEggBar() { 
  eggBar.textContent = `🥚 ${foundEggs.length}/${TOTAL_EGGS}`; 
}
function markEgg(id) {
  if (foundEggs.includes(id)) return;
  foundEggs.push(id); 
  localStorage.setItem('put_eggs', JSON.stringify(foundEggs)); 
  updateEggBar();
  beep(1200, .1, 'triangle', .15); 
  setTimeout(() => beep(1600, .15, 'triangle', .15), 100);
}

let audioCtx = null;
function beep(freq, dur=0.1, type='sine', vol=0.12) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); 
    const g = audioCtx.createGain();
    o.type = type; 
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); 
    g.connect(audioCtx.destination); 
    o.start(); 
    o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function okSound() { 
  beep(880, .1, 'triangle', .12);

function saveProgress() { 
  localStorage.setItem('put_progress', JSON.stringify({ currentLevel, inSecret, secretStage, secretSolved })); 
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem('put_progress') || '{}');
    if (p.currentLevel) currentLevel = p.currentLevel;
    if (p.inSecret) inSecret = p.inSecret;
    if (p.secretStage) secretStage = p.secretStage;
    if (p.secretSolved) secretSolved = p.secretSolved;
  } catch(e) {}
}

function normalizeNum(raw) {
  if (raw === null || raw === undefined) return NaN;
  let s = String(raw).trim().replace(',', '.').replace(/\s+/g, '');
  if (s === '') return NaN;
  s = s.replace(/^0+(?=\d)/, '');
  const n = Number(s); 
  return isNaN(n) ? NaN : n;
}

function clearArea() { 
  areaEl.innerHTML = ''; 
  feedbackEl.textContent = ''; 
  feedbackEl.className = ''; 
}
function fb(text, cls='') { 
  feedbackEl.textContent = text; 
  feedbackEl.className = cls; 
}
function makeCell(content, onClick, cls='') {
  const d = document.createElement('div'); 
  d.className = 'cell ' + cls; 
  d.textContent = content;
  d.addEventListener('click', () => onClick(d)); 
  return d;
}
function makeBtn(text, onClick, cls='btn') {
  const b = document.createElement('button'); 
  b.className = cls; 
  b.textContent = text;
  b.addEventListener('click', onClick); 
  return b;
}
function makeInput(placeholder='') {
  const i = document.createElement('input'); 
  i.type = 'text'; 
  i.placeholder = placeholder; 
  return i;
}
function showWin(text, nextFn) {
  winTitle.textContent = 'УРОВЕНЬ ПРОЙДЕН';
  winText.textContent = text || ''; 
  winOverlay.classList.add('show'); 
  okSound();
  nextBtn.onclick = () => { 
    winOverlay.classList.remove('show'); 
    nextFn(); 
  };
}
function showEgg(msg, duration=3500) {
  eggToast.textContent = msg; 
  eggToast.classList.add('show');

  eggToast._t = setTimeout(() => eggToast.classList.remove('show'), duration);
}

/* ПАСХАЛКА 2: NIFI */
const CORNERS = ['TL','TR','BL','BR'];
let cornerIdx = 0;
const cornerEls = { 
  TL: document.getElementById('cTL'), 
  TR: document.getElementById('cTR'), 
  BL: document.getElementById('cBL'), 
  BR: document.getElementById('cBR') 
};
document.addEventListener('pointerdown', e => {
  const w = window.innerWidth, h = window.innerHeight, x = e.clientX, y = e.clientY, EDGE = 80;
  let corner = null;
  if (x < EDGE && y < EDGE) corner = 'TL';
  else if (x > w - EDGE && y < EDGE) corner = 'TR';
  else if (x < EDGE && y > h - EDGE) corner = 'BL';
  else if (x > w - EDGE && y > h - EDGE) corner = 'BR';
  if (!corner) return;
  if (corner === CORNERS[cornerIdx]) {
    cornerEls[corner].classList.add('active'); 
    beep(600 + cornerIdx * 200, .08, 'sine', .1);
    setTimeout(() => cornerEls[corner].classList.remove('active'), 250); 
    cornerIdx++;
    if (cornerIdx === CORNERS.length) {
      cornerIdx = 0; 
      markEgg('nifi'); 
      showEgg('👾 N-I-F-I. NIFILIFIN помнит тебя.', 4500);
      beep(1047, .15, 'triangle', .15); 
      setTimeout(() => beep(1319, .15, 'triangle', .15), 150); 
      setTimeout(() => beep(1568, .2, 'triangle', .15), 300);
    }
  } else { 
    cornerIdx = corner === CORNERS[0] ? 1 : 0; 
  }
}, true);

function levelInputNumber(answer, hint='') {
  if (hint) taskEl.innerHTML = hint;
  const inp = makeInput('число'); areaEl.appendChild(inp);
  areaEl.appendChild(makeBtn('ОТВЕТ', () => {
    const raw = inp.value.trim();
    if (raw === 'admin' && currentLevel === 13) { 
      localStorage.setItem('put_admin', '1'); 
      adminBtn.classList.add('unlocked'); 
      openAdmin(); 
      return; 
    }
    const v = normalizeNum(raw); const a = normalizeNum(answer);
    if (!isNaN(v) && !isNaN(a) && Math.abs(v - a) < 1e-9) showWin('Верно.', () => nextLevel());
    else { errSound(); fb('Неверно.', 'err'); }
  }));
}
function levelPressCondition(nums, checkFn, winText='Готово.') {
  const targets = nums.filter(checkFn); let pressed = 0;
  nums.forEach(n => {
    areaEl.appendChild(makeCell(n, (el) => {
      if (el.classList.contains('on')) return;
      if (checkFn(n)) {
        el.classList.add('on'); pressed++; 
        beep(500 + pressed*20, .04, 'square', .06);
        if (pressed === targets.length) showWin(winText, () => nextLevel());
      } else { 
        el.classList.add('wrong'); errSound(); 
        setTimeout(()=>el.classList.remove('wrong'), 350); 
      }
    }));
  });
}
function levelFindOdd(count, total, winText='Найдено.') {
  const items = Array(total).fill('🟦'); const odds = new Set();
  while (odds.size < count) odds.add(Math.floor(Math.random()*total));
  odds.forEach(i => items[i] = '🟪'); let found = 0;
  items.forEach((e, i) => {
    const c = makeCell(e, (el) => {
      if (el.classList.contains('on')) return;
      if (odds.has(i)) {
        el.classList.add('on'); found++; 
        beep(600 + found*80, .06, 'sine', .09);
        if (found === count) showWin(winText, () => nextLevel());
      } else { 
        el.classList.add('wrong'); errSound(); 
        setTimeout(()=>el.classList.remove('wrong'), 350); 
      }
    });
    c.style.fontSize = '17px'; areaEl.appendChild(c);
  });
}
function levelMemoryPairs(pairs, winText='Все пары.') {
  const arr = []; pairs.forEach(p => { arr.push(p); arr.push(p); });
  arr.sort(() => Math.random() - 0.5);
  let first = null, firstEl = null, matched = 0, lock = false;
  arr.forEach(v => {
    const c = makeCell('?', (el) => {
      if (lock || el.classList.contains('on')) return;
      el.textContent = v; el.classList.add('on'); 
      beep(500, .06, 'sine', .08);
      if (!first) { first = v; firstEl = el; return; }
      if (v === first) {
        matched++; first = null; firstEl = null;
        if (matched === pairs.length) showWin(winText, () => nextLevel());
      } else {
        lock = true;
        setTimeout(() => {
          el.textContent = '?'; el.classList.remove('on');
          if (firstEl) { firstEl.textContent = '?'; firstEl.classList.remove('on'); }
          first = null; firstEl = null; lock = false; errSound();
        }, 500);
      }
    });
    areaEl.appendChild(c);
  });
}

  taskEl.innerHTML = `<span style="color:#ffd700; font-weight:bold;">[ ${caesarStep + 1} / 10 ]</span><br>${q.q}`;

        renderCaesarStep();
      } else {
        errSound(); fb('Неверно.', 'err');

const MASON_SYMBOLS = ['△','▽','◉','✡','☥','☭','⚖','⚜','☤','♆','☬','☯','★','☆','∞','∑','∏','√','∫','∂','∇','⊕','⊗','⊙','∴','∵','≈','≡','≠','⟁','⧉','⬢','⬣','⯃','⯄','⚰','⚱','α','β','γ','δ','ε','ζ','η','θ'];
function scatterSymbols() {
  const screen = document.getElementById('finalScreen');
  screen.querySelectorAll('.mason-sym').forEach(e => e.remove());
  for (let i = 0; i < 40; i++) {
    const span = document.createElement('span');
    span.className = 'mason-sym'; span.textContent = MASON_SYMBOLS[Math.floor(Math.random() * MASON_SYMBOLS.length)];
    span.style.left = (Math.random() * 92 + 2) + 'vw'; span.style.top = (Math.random() * 92 + 2) + 'vh';
    span.style.fontSize = (14 + Math.random() * 22) + 'px'; span.style.opacity = (0.3 + Math.random() * 0.4).toFixed(2);
    screen.appendChild(span);
  }
}
function showFinalScreen() {
  document.body.className = ''; document.getElementById('stage').style.display = 'none'; document.getElementById('topBar').style.display = 'none';
  const screen = document.getElementById('finalScreen'); screen.classList.add('show'); scatterSymbols();

const secretStages = [
  () => { taskEl.innerHTML = '<b>Гексаграмма.</b><br>Нажми на вершины по порядку: <b>1→2→3→4→5→6</b>.'; const hex = document.createElement('div'); hex.className = 'hexWrap'; const angles = [-90, -30, 30, 90, 150, 210]; const dots = []; angles.forEach((a, i) => { const rad = a * Math.PI / 180; const cx = 150 + Math.cos(rad) * 120; const cy = 150 + Math.sin(rad) * 120; const d = document.createElement('div'); d.className = 'hexDot'; d.textContent = i + 1; d.style.left = cx + 'px'; d.style.top = cy + 'px'; d.addEventListener('click', () => { if (d.classList.contains('on')) return; const next = dots.filter(x => x.classList.contains('on')).length; if (i === next) { d.classList.add('on'); beep(400 + i*80, .08, 'square', .1); if (next === 5) { setTimeout(() => { beep(80, .5, 'sawtooth', .2); secretStage = 1; saveProgress(); renderSecretLevel(); }, 400); } } else { d.classList.add('wrong'); errSound(); setTimeout(() => dots.forEach(x => { x.classList.remove('on'); x.classList.remove('wrong'); }), 400); } }); hex.appendChild(d); dots.push(d); }); const lines = [[0,2],[2,4],[4,0],[1,3],[3,5],[5,1]]; lines.forEach(([a,b]) => { const ca = angles[a]*Math.PI/180, cb = angles[b]*Math.PI/180; const x1 = 150 + Math.cos(ca)*120, y1 = 150 + Math.sin(ca)*120; const x2 = 150 + Math.cos(cb)*120, y2 = 150 + Math.sin(cb)*120; const line = document.createElement('div'); line.className = 'hexLine'; const len = Math.hypot(x2-x1, y2-y1); const ang = Math.atan2(y2-y1, x2-x1) * 180/Math.PI; line.style.width = len+'px'; line.style.height = '2px'; line.style.left = x1+'px'; line.style.top = y1+'px'; line.style.transformOrigin = '0 0'; line.style.transform = `rotate(${ang}deg)`; hex.appendChild(line); }); areaEl.innerHTML = ''; areaEl.appendChild(hex); },
  () => { taskEl.innerHTML = 'Всевидящее око видит тебя.<br><b>Сколько вершин у глаза?</b>'; const inp = makeInput('?'); inp.classList.add('hellCell'); areaEl.innerHTML = ''; areaEl.appendChild(inp); areaEl.appendChild(makeBtn('ОТВЕТ', () => { if (normalizeNum(inp.value) === 2) { secretStage = 2; saveProgress(); renderSecretLevel(); beep(200, .3, 'sawtooth', .15); } else { errSound(); fb('Око недовольно.', 'err'); } })); },
  () => { taskEl.innerHTML = 'Циркуль и наугольник.<br><b>Введи священное число.</b>'; const inp = makeInput('...'); inp.classList.add('hellCell'); areaEl.innerHTML = ''; areaEl.appendChild(inp); areaEl.appendChild(makeBtn('ПРОВЕРИТЬ', () => { if (inp.value.trim() === '666') { secretStage = 3; saveProgress(); renderSecretLevel(); beep(60, .8, 'sawtooth', .2); } else { errSound(); fb('Не то.', 'err'); } })); },
  () => { taskEl.innerHTML = 'Сатурн отпускает.<br><b>6 + 6 + 6 = ?</b>'; const inp = makeInput('?'); inp.classList.add('hellCell'); areaEl.innerHTML = ''; areaEl.appendChild(inp); const btn = makeBtn('ВЕРНУТЬСЯ', () => { if (normalizeNum(inp.value) === 18) { document.body.className = ''; inSecret = false; secretStage = 0; secretSolved = true; saveProgress(); winTitle.textContent = 'ВОЗВРАЩЕНИЕ'; winText.textContent = 'Сатурн отпустил тебя.'; winOverlay.classList.add('show'); nextBtn.onclick = () => { winOverlay.classList.remove('show'); currentLevel = 7; renderLevel(); }; } else { errSound(); fb('Сатурн недоволен.', 'err'); } }, 'btn'); btn.style.background = 'linear-gradient(135deg,#f33,#900)'; areaEl.appendChild(btn); }
];
function renderSecretLevel() { document.body.className = 'hell'; document.getElementById('eyeBg').style.display = 'block'; lvlLabel.textContent = 'УРОВЕНЬ −666'; clearArea(); secretStages[secretStage](); }

function renderLevel() {
  clearArea(); document.body.className = ''; 
  document.getElementById('secretBtn').style.pointerEvents = 'none'; document.getElementById('secretDot').classList.remove('active'); document.getElementById('eyeBg').style.display = 'none';
  document.getElementById('finalScreen').classList.remove('show'); document.getElementById('stage').style.display = 'flex'; document.getElementById('topBar').style.display = 'flex';
  
  gameTitle.style.display = 'block';
  gameAuthor.style.display = 'block';

  if (inSecret) { renderSecretLevel(); saveProgress(); return; }
  
  lvlLabel.textContent = 'УРОВЕНЬ ' + currentLevel + ' / ' + totalLevels;
  
  if (currentLevel === 'caesar') {
    renderCaesarLevel();
    return;
  }
  
  gameTitle.style.display = 'none';
  gameAuthor.style.display = 'none';

  if (LEVELS[currentLevel]) LEVELS[currentLevel](); else taskEl.textContent = 'Конец.';
  saveProgress();
}
function nextLevel() { currentLevel++; if (currentLevel > totalLevels) currentLevel = totalLevels; renderLevel(); }

updateEggBar(); loadProgress(); renderLevel();
</script>
</body>
</html>
